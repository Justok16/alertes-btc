name: BTC Momentum Alert

on:
  schedule:
    # 08:00 UTC chaque jour = apres la mise a jour quotidienne du F&G Index
    - cron: "0 8 * * *"
  workflow_dispatch: {}

# Audit du 30/08/2026 : meme garde-fou que trading-ct-alert.yml/
# trading-ct-eu-alert.yml (backporte apres coup, oublie a la creation de ce
# workflow) -- empeche deux executions de tourner en parallele (cron +
# declenchement manuel proches dans le temps), sans quoi la 2e echouait en
# tentant de pousser state.json alors que la 1ere venait deja de pousser.
concurrency:
  group: btc-alert
  cancel-in-progress: false

jobs:
  check-btc-momentum:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run BTC alert check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python btc_alert.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Update BTC momentum state"
          git pull --rebase origin main
          git push
