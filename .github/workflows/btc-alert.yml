name: BTC Momentum Alert

on:
  schedule:
    # 08:00 UTC chaque jour = apres la mise a jour quotidienne du F&G Index
    - cron: "0 8 * * *"
  workflow_dispatch: {}

# Audit du 30/08/2026 : meme garde-fou que trading-ct-alert.yml/
# trading-ct-eu-alert.yml (backporte apres coup, oublie a la creation de ce
# workflow) -- empeche deux executions de tourner en parallele (cron +
# declenchement manuel proches dans le temps), sans quoi la 2e echouait en
# tentant de pousser state.json alors que la 1ere venait deja de pousser.
concurrency:
  group: btc-alert
  cancel-in-progress: false

jobs:
  check-btc-momentum:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run BTC alert check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python btc_alert.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Update BTC momentum state"
          # Audit du 03/09/2026 : le concurrency guard ci-dessus empeche deux
          # executions de CE workflow de tourner en meme temps, mais pas un
          # push venant d'ailleurs (autre workflow, commit manuel) pile entre
          # notre rebase et notre push, ni un hoquet transitoire de l'API
          # GitHub -- avant ce correctif, un seul echec de push faisait
          # passer tout le job au rouge et perdait la mise a jour d'etat de
          # ce cycle. On retente quelques fois avant d'abandonner pour de bon.
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            git rebase --abort 2>/dev/null || true
            if [ "$i" -eq 3 ]; then
              echo "Echec du push apres 3 tentatives" >&2
              exit 1
            fi
            sleep 5
          done
