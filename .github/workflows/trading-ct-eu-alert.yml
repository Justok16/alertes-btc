name: Trading CT EU ETF Alert

on:
  schedule:
    # Une fois par jour (18h00 UTC, apres cloture Xetra ~15h30 UTC) --
    # tier gratuit EODHD limite a 20 appels/jour, 6 actifs = 6 appels/jour.
    - cron: "0 18 * * 1-5"
  workflow_dispatch: {}

concurrency:
  group: trading-ct-eu-alert
  cancel-in-progress: false

jobs:
  check-trading-ct-eu:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: trading-ct
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run EU ETF alert check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EODHD_API_TOKEN: ${{ secrets.EODHD_API_TOKEN }}
        run: python trading_alert_eu.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add eu_state.json
          git diff --staged --quiet || git commit -m "Update trading-ct EU state"
          git pull --rebase origin main
          git push
