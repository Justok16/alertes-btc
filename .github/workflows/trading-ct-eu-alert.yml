name: Trading CT EU ETF Alert

on:
  schedule:
    # Filets de securite derriere le declencheur externe (cron-job.org, 16h05 UTC)
    # -- le script n'execute qu'UN cycle par cloture Xetra (17h30 Europe/Berlin,
    # cf. cycle_deja_fait) : un passage de trop s'arrete sans aucun appel EODHD.
    # 16h40 UTC couvre l'heure d'hiver (cloture a 16h30 UTC, le declencheur de
    # 16h05 tombe alors AVANT la cloture et est ignore a juste titre) ; 18h00 UTC
    # reste en secours. Le cron GitHub part souvent avec 2 a 6 h de retard.
    # Tier gratuit EODHD : 20 appels/jour, 1 appel par ETF et par cycle
    # (cf. EU_WATCHLIST ; un test garde le plafond).
    - cron: "40 16 * * 1-5"
    - cron: "0 18 * * 1-5"
  workflow_dispatch:
    inputs:
      forcer:
        description: "Forcer le cycle meme si un passage a deja eu lieu depuis la derniere cloture Xetra"
        type: boolean
        default: false

concurrency:
  group: trading-ct-eu-alert
  cancel-in-progress: false

jobs:
  check-trading-ct-eu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        working-directory: trading-ct
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: trading-ct/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run EU ETF alert check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EODHD_API_TOKEN: ${{ secrets.EODHD_API_TOKEN }}
          # Un seul cycle par cloture Xetra (cf. cycle_deja_fait dans le script) ;
          # `forcer` (Run workflow) passe outre pour un test manuel.
          FORCER_CYCLE: ${{ github.event.inputs.forcer == 'true' && '1' || '' }}
          # Ajoutes le 04/09/2026 (migration memoire_supabase.py) : SI ces
          # 2 secrets sont configures (Settings > Secrets and variables >
          # Actions), l'etat passe par Supabase au lieu d'etre commite en
          # Git ci-dessous -- absents, comportement strictement inchange.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python trading_alert_eu.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add eu_state.json
          git diff --staged --quiet || git commit -m "Update trading-ct EU state"
          # Audit du 03/09/2026 : le concurrency guard ci-dessus empeche deux
          # executions de CE workflow de tourner en meme temps, mais pas un
          # push venant d'ailleurs (autre workflow, commit manuel) pile entre
          # notre rebase et notre push, ni un hoquet transitoire de l'API
          # GitHub -- avant ce correctif, un seul echec de push faisait
          # passer tout le job au rouge et perdait la mise a jour d'etat de
          # ce cycle. On retente quelques fois avant d'abandonner pour de bon.
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            git rebase --abort 2>/dev/null || true
            if [ "$i" -eq 3 ]; then
              echo "Echec du push apres 3 tentatives" >&2
              exit 1
            fi
            sleep 5
          done
