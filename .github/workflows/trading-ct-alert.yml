name: Trading CT Alert

on:
  schedule:
    # Toutes les 5 minutes. Les actions/ETF sont de toute facon ignores
    # hors horaires du marche US (voir is_us_market_open() dans le script).
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

# Empeche deux executions de tourner en parallele (cron + declenchement
# manuel proches dans le temps) : sans ca, la 2e a echoue en tentant de
# pousser state.json alors que la 1ere venait deja de pousser sa version
# ("! [rejected] main -> main (fetch first)").
concurrency:
  group: trading-ct-alert
  cancel-in-progress: false

jobs:
  check-trading-ct:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: trading-ct
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run trading alert check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: python trading_alert.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Update trading-ct state"
          # Audit du 03/09/2026 : le concurrency guard ci-dessus empeche deux
          # executions de CE workflow de tourner en meme temps, mais pas un
          # push venant d'ailleurs (autre workflow, commit manuel) pile entre
          # notre rebase et notre push, ni un hoquet transitoire de l'API
          # GitHub -- avant ce correctif, un seul echec de push faisait
          # passer tout le job au rouge et perdait la mise a jour d'etat de
          # ce cycle (cron toutes les 5 min : perte particulierement genante
          # ici). On retente quelques fois avant d'abandonner pour de bon.
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            git rebase --abort 2>/dev/null || true
            if [ "$i" -eq 3 ]; then
              echo "Echec du push apres 3 tentatives" >&2
              exit 1
            fi
            sleep 5
          done
