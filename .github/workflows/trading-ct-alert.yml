name: Trading CT Alert

on:
  schedule:
    # Toutes les 15 minutes. Les actions/ETF sont de toute facon ignores
    # hors horaires du marche US (voir is_us_market_open() dans le script).
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

# Empeche deux executions de tourner en parallele (cron + declenchement
# manuel proches dans le temps) : sans ca, la 2e a echoue en tentant de
# pousser state.json alors que la 1ere venait deja de pousser sa version
# ("! [rejected] main -> main (fetch first)").
concurrency:
  group: trading-ct-alert
  cancel-in-progress: false

jobs:
  check-trading-ct:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: trading-ct
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run trading alert check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: python trading_alert.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Update trading-ct state"
          git pull --rebase origin main
          git push
